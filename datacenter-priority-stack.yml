AWSTemplateFormatVersion: '2010-09-09'
Description: URL Shortner

# ----------------- Parameters -----------------
Resources:
  DynamoDBTableUrlshortenertable:
    UpdateReplacePolicy: Retain
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      SSESpecification:
        SSEEnabled: false
      TableName: url-shortener-table
      AttributeDefinitions:
        - AttributeType: S
          AttributeName: shortcode
      ContributorInsightsSpecification:
        Enabled: false
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      WarmThroughput:
        ReadUnitsPerSecond: 12000
        WriteUnitsPerSecond: 4000
      KeySchema:
        - KeyType: HASH
          AttributeName: shortcode
      DeletionProtectionEnabled: false
      TableClass: STANDARD
      Tags: []
      TimeToLiveSpecification:
        Enabled: false

  IAMRoleCreateShortURLLambdaRole:
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    Properties:
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      MaxSessionDuration: 3600
      RoleName: CreateShortURLLambdaRole
      Description: Allows Lambda functions to call AWS services on your behalf.
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Resource: !GetAtt DynamoDBTableUrlshortenertable.Arn
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Effect: Allow
                Sid: VisualEditor0
          PolicyName: CreateShortURLLambdaRolePolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com

  IAMRoleRedirectLambdaRole:
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    Properties:
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      MaxSessionDuration: 3600
      RoleName: RedirectLambdaRole
      Description: Allows Lambda functions to call AWS services on your behalf.
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Resource: !GetAtt DynamoDBTableUrlshortenertable.Arn
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Effect: Allow
                Sid: VisualEditor0
          PolicyName: RedirectLambdaRolePolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com

  CreateShortURL:
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Type: AWS::Lambda::Function
    Properties:
      Architectures:
        - x86_64
      Code:
        S3Bucket: cc-demo-bucket-p1
        S3Key: create-short-url.mjs
      Description: ''
      EphemeralStorage:
        Size: 512
      Handler: index.handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/CreateShortURL
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: nodejs24.x
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Timeout: 30
      Role: !GetAtt IAMRoleCreateShortURLLambdaRole.Arn

  RedirectToOriginal:
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Type: AWS::Lambda::Function
    Properties:
      Architectures:
        - x86_64
      Code:
        S3Bucket: cc-demo-bucket-p1
        S3Key: redirect-to-original.mjs
      Description: ''
      EphemeralStorage:
        Size: 512
      Handler: index.handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/RedirectToOriginal
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: nodejs24.x
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Timeout: 30
      Role: !GetAtt IAMRoleRedirectLambdaRole.Arn

  ApiGatewayV2RouteLn:
    UpdateReplacePolicy: Retain
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Delete
    Properties:
      Target: integrations/vy2kzo2
      RequestModels: {}
      AuthorizationScopes: []
      ApiKeyRequired: false
      RouteKey: POST /shorten
      AuthorizationType: NONE
      ApiId: mwraaebttk

  ApiGatewayV2Api:
    UpdateReplacePolicy: Retain
    Type: AWS::ApiGatewayV2::Api
    DeletionPolicy: Delete
    Properties:
      IpAddressType: ipv4
      RouteSelectionExpression: $request.method $request.path
      DisableExecuteApiEndpoint: false
      ProtocolType: HTTP
      Tags: {}
      Name: url-shortener-api

  LambdaPermissionFunctionCreateShortURL:
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    DeletionPolicy: Delete
    Properties:
      FunctionName: arn:aws:lambda:us-east-1:263846838953:function:CreateShortURL
      Action: lambda:InvokeFunction
      SourceArn: arn:aws:execute-api:us-east-1:263846838953:mwraaebttk/*/*/shorten
      Principal: apigateway.amazonaws.com

  ApiGatewayV2IntegrationN9:
    UpdateReplacePolicy: Retain
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Delete
    Properties:
      IntegrationUri: arn:aws:lambda:us-east-1:263846838953:function:CreateShortURL
      PayloadFormatVersion: '2.0'
      ConnectionType: INTERNET
      RequestTemplates: {}
      ResponseParameters: {}
      TimeoutInMillis: 30000
      ApiId: mwraaebttk
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY

  ApiGatewayV2Route:
    UpdateReplacePolicy: Retain
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Delete
    Properties:
      Target: integrations/sxu65j8
      RequestModels: {}
      AuthorizationScopes: []
      ApiKeyRequired: false
      RouteKey: GET /{shortcode}
      AuthorizationType: NONE
      ApiId: mwraaebttk

  ApiGatewayV2Integration:
    UpdateReplacePolicy: Retain
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Delete
    Properties:
      IntegrationUri: arn:aws:lambda:us-east-1:263846838953:function:RedirectToOriginal
      PayloadFormatVersion: '2.0'
      ConnectionType: INTERNET
      RequestTemplates: {}
      ResponseParameters: {}
      TimeoutInMillis: 30000
      ApiId: mwraaebttk
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY

  LambdaPermissionFunctionRedirectToOriginal:
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    DeletionPolicy: Delete
    Properties:
      FunctionName: arn:aws:lambda:us-east-1:263846838953:function:RedirectToOriginal
      Action: lambda:InvokeFunction
      SourceArn: arn:aws:execute-api:us-east-1:263846838953:mwraaebttk/*/*/{shortcode}
      Principal: apigateway.amazonaws.com